name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you want solved and how you imagine the CLI behaving.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What pain point does this address?
      placeholder: When transcribing long campaigns, I need ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should Episode Transcribe behave?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, flags, or workflows you tried.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - CLI / UX
        - Transcription quality
        - Speaker profiles / diarization
        - Install / packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for similar requests
          required: true
        - label: I am willing to help test or implement this
          required: false
