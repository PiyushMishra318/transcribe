# Optional manual CPU builds (Actions artifacts). Main-branch releases use auto-release.yml + release.yml.
name: Build artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/build-release-artifacts.yml
    with:
      version: ${{ needs.meta.outputs.version }}
      upload_artifact: true
      artifact_retention_days: 90
