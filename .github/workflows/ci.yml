name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config curl

      - name: Setup sherpa-onnx prebuilt libs
        run: bash scripts/setup-sherpa-onnx-prebuilt.sh

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --no-default-features -- -D warnings

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libasound2-dev pkg-config curl

      - name: Setup sherpa-onnx prebuilt libs
        run: bash scripts/setup-sherpa-onnx-prebuilt.sh

      - name: Build (CPU)
        run: cargo build --locked --no-default-features

      - name: CLI smoke tests
        run: cargo test --locked --no-default-features

      - name: Download test models
        run: bash scripts/download-ci-test-models.sh

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Code coverage
        run: |
          cargo llvm-cov --locked --no-default-features --release --fail-under-lines 85

      - name: Help and version
        run: |
          ./target/debug/transcribe --version
          ./target/debug/transcribe help
          ./target/debug/transcribe help run | head -n 5 || true

  e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg curl libasound2-dev pkg-config

      - name: Setup sherpa-onnx prebuilt libs
        run: bash scripts/setup-sherpa-onnx-prebuilt.sh

      - name: Download test models
        run: bash scripts/download-ci-test-models.sh

      - name: Build release (CPU)
        run: cargo build --release --locked --no-default-features

      - name: E2E transcribe test clip
        env:
          TRANSCRIBE_MODELS_DIR: ${{ github.workspace }}/models
        run: cargo test --release --locked --no-default-features e2e_transcribe_test_clip -- --ignored
