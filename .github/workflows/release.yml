name: Alpha release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0-alpha)
        required: true
        default: v0.1.0-alpha
  push:
    tags:
      - v*-alpha

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config curl

      - name: Install sherpa-onnx prebuilt libraries
        run: bash scripts/setup-sherpa-onnx-prebuilt.sh

      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build release (CPU)
        run: cargo build --release --locked --no-default-features

      - name: Package Linux tarball
        shell: bash
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          TARGET="x86_64-unknown-linux-gnu"
          PKG="transcribe-v${VERSION}-${TARGET}"
          mkdir -p "dist/${PKG}"
          cp target/release/transcribe "dist/${PKG}/"
          shopt -s nullglob
          for lib in target/release/*.so*; do
            cp "$lib" "dist/${PKG}/"
          done
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: true
          generate_release_notes: true
          files: dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
