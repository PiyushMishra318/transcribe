name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.1.0-alpha or v1.0.0)
        required: true
        default: v0.1.0-alpha

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="${{ github.event.inputs.tag }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-alpha ]] || [[ "$TAG" == *-beta ]] || [[ "$TAG" == *-rc* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" =~ ^0\. ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build-release-artifacts.yml
    secrets: inherit
    permissions:
      contents: read
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.tag }}
      upload_artifact: true
      artifact_retention_days: 1

  release:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify and list release assets
        id: assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          mapfile -t files < <(find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No release archives found under artifacts/"
            find artifacts -print 2>/dev/null || true
            exit 1
          fi
          if [[ ${#files[@]} -lt 3 ]]; then
            echo "::warning::Some platform builds failed; publishing ${#files[@]} archive(s)."
          fi
          ls -la "${files[@]}"
          for f in "${files[@]}"; do
            if [[ ! -s "$f" ]]; then
              echo "Empty asset: $f"
              exit 1
            fi
          done
          {
            echo "paths<<EOF"
            printf '%s\n' "${files[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: ${{ steps.assets.outputs.paths }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
