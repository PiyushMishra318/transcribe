# Reusable multi-platform CPU release build + packaging.
# Called by release.yml (GitHub Release assets). Sherpa setup uses absolute SHERPA_ONNX_LIB_DIR.
name: Build release artifacts

on:
  workflow_call:
    inputs:
      version:
        description: Version string for asset names (tag without leading v, e.g. 0.1.1-alpha)
        required: true
        type: string
      upload_artifact:
        description: Upload platform archives as workflow artifacts
        required: false
        type: boolean
        default: true
      artifact_retention_days:
        description: Retention for uploaded artifacts
        required: false
        type: number
        default: 1
      ref:
        description: Git ref to build (tag or SHA). Defaults to the triggering ref.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_ext: .tar.gz
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_ext: .zip
          - runner: macos-latest
            target: aarch64-apple-darwin
            asset_ext: .tar.gz
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: target/sherpa-onnx-prebuilt

      - name: Install Linux system dependencies
        if: matrix.runner == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev pkg-config curl

      - name: Install macOS system dependencies
        if: matrix.runner == 'macos-latest'
        run: brew install pkg-config

      - name: Setup sherpa-onnx prebuilt libs
        if: matrix.runner != 'windows-latest'
        run: bash scripts/setup-sherpa-onnx-prebuilt.sh

      - name: Setup sherpa-onnx prebuilt libs
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: ./scripts/setup-sherpa-onnx-prebuilt.ps1

      - name: Build release (CPU)
        if: matrix.runner != 'windows-latest'
        shell: bash
        run: |
          test -d "$SHERPA_ONNX_LIB_DIR"
          ls -la "$SHERPA_ONNX_LIB_DIR"
          cargo build --release --locked --no-default-features
          ./target/release/transcribe --version

      - name: Build release (CPU)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          if (-not (Test-Path -PathType Container $env:SHERPA_ONNX_LIB_DIR)) {
            throw "SHERPA_ONNX_LIB_DIR missing: $($env:SHERPA_ONNX_LIB_DIR)"
          }
          Get-ChildItem $env:SHERPA_ONNX_LIB_DIR
          cargo build --release --locked --no-default-features
          Get-ChildItem "$env:SHERPA_ONNX_LIB_DIR\*.dll" -ErrorAction SilentlyContinue |
            Copy-Item -Destination target/release/ -Force
          ./target/release/transcribe.exe --version

      - name: Package Linux
        if: matrix.runner == 'ubuntu-latest'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TARGET="${{ matrix.target }}"
          PKG="transcribe-v${VERSION}-${TARGET}"
          mkdir -p "dist/${PKG}"
          cp target/release/transcribe "dist/${PKG}/"
          shopt -s nullglob
          for lib in target/release/*.so* "${SHERPA_ONNX_LIB_DIR}"/*.so*; do
            [[ -e "$lib" ]] || continue
            cp -f "$lib" "dist/${PKG}/"
          done
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"

      - name: Package Windows
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          $target = "${{ matrix.target }}"
          $pkg = "transcribe-v$version-$target"
          New-Item -ItemType Directory -Force -Path "dist/$pkg" | Out-Null
          Copy-Item target/release/transcribe.exe "dist/$pkg/"
          $dllDirs = @("target/release", $env:SHERPA_ONNX_LIB_DIR)
          foreach ($dir in $dllDirs) {
            if (Test-Path $dir) {
              Get-ChildItem "$dir/*.dll" -ErrorAction SilentlyContinue |
                Copy-Item -Destination "dist/$pkg/" -Force
            }
          }
          $zip = "dist/$pkg.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/$pkg" -DestinationPath $zip

      - name: Package macOS
        if: matrix.runner == 'macos-latest'
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          TARGET="${{ matrix.target }}"
          PKG="transcribe-v${VERSION}-${TARGET}"
          mkdir -p "dist/${PKG}"
          cp target/release/transcribe "dist/${PKG}/"
          shopt -s nullglob
          for lib in target/release/*.dylib "${SHERPA_ONNX_LIB_DIR}"/*.dylib; do
            [[ -e "$lib" ]] || continue
            cp -f "$lib" "dist/${PKG}/"
          done
          tar -C dist -czf "dist/${PKG}.tar.gz" "${PKG}"

      - name: Upload artifact
        if: inputs.upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*${{ matrix.asset_ext }}
          retention-days: ${{ inputs.artifact_retention_days }}
